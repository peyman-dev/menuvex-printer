<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novex Printer Agent — Demo</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; max-width: 860px; margin-inline: auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #888; margin-bottom: 20px; font-size: 14px; }
  .card { border: 1px solid #ccc; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  label { font-size: 13px; color: #888; display: block; margin-bottom: 4px; }
  input, select, textarea, button { font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid #bbb; }
  input, textarea, select { background: transparent; color: inherit; }
  input[type=text], input[type=password], textarea { width: 100%; }
  button { cursor: pointer; }
  button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  button:disabled { opacity: .5; cursor: default; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #999; margin-right: 6px; vertical-align: baseline; }
  .dot.ok { background: #1da454; } .dot.err { background: #d93025; }
  .printer { border: 1px solid #bbb; border-radius: 8px; padding: 12px; margin-top: 10px; }
  .printer .name { font-weight: 600; }
  .printer .meta { font-size: 13px; color: #888; margin: 4px 0 10px; font-family: ui-monospace, monospace; word-break: break-all; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  #log { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; background: rgba(127,127,127,.12); border-radius: 8px; padding: 10px; max-height: 260px; overflow: auto; margin: 0; }
  code { font-family: ui-monospace, monospace; font-size: 12px; }
</style>
</head>
<body>
<h1>Novex Printer Agent — Demo</h1>
<div class="sub">Talk to the local agent at <code>http://127.0.0.1:8765</code> and send raw ESC/POS bytes to a printer.</div>

<div class="card">
  <div class="row" style="justify-content: space-between">
    <div><span id="agentDot" class="dot"></span><strong>Agent: <span id="agentState">Unknown</span></strong>
      <span id="agentMeta" class="sub"></span></div>
    <div class="row">
      <button id="btnConnect" class="primary">Connect</button>
      <button id="btnWs">Subscribe: off</button>
    </div>
  </div>
  <div class="grid2" style="margin-top:12px">
    <div><label>Host</label><input id="host" type="text" value="127.0.0.1"></div>
    <div><label>Port</label><input id="port" type="text" value="8765"></div>
  </div>
  <div style="margin-top:8px"><label>API token (shown by the agent on startup / <code>--print-token</code>)</label>
    <input id="token" type="password" placeholder="paste token here" autocomplete="off"></div>
</div>

<div class="card">
  <div class="row" style="justify-content: space-between">
    <strong>Printers</strong>
    <div class="row">
      <label style="display:inline"><input id="scan" type="checkbox" style="width:auto"> LAN scan</label>
      <button id="btnRefresh">Refresh</button>
    </div>
  </div>
  <div id="printers"><p class="sub">Not loaded yet.</p></div>
  <details style="margin-top:12px">
    <summary>Register a LAN printer manually</summary>
    <div class="grid2" style="margin-top:8px">
      <div><label>Name</label><input id="regName" type="text" placeholder="OCOM"></div>
      <div><label>Address</label><input id="regAddr" type="text" placeholder="192.168.1.50"></div>
    </div>
    <div class="grid2" style="margin-top:8px">
      <div><label>Port</label><input id="regPort" type="text" value="9100"></div>
      <div style="align-self:end"><button id="btnRegister">Register</button></div>
    </div>
  </details>
</div>

<div class="card">
  <strong>Custom payload (hex bytes, e.g. <code>1B 40 48 69 1D 56 00</code>)</strong>
  <div class="row" style="margin-top:8px">
    <input id="hex" type="text" style="flex:1" placeholder="1B 40 ...">
    <select id="hexPrinter"></select>
    <button id="btnHex">Send</button>
  </div>
</div>

<div class="card">
  <strong>Log</strong>
  <pre id="log"></pre>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = { load(k, d) { try { return localStorage.getItem(k) || d; } catch { return d; } },
                save(k, v) { try { localStorage.setItem(k, v); } catch {} } };

let defaultHost = "127.0.0.1", defaultPort = "8765";
try {
  // When served by the agent itself (http://127.0.0.1:8765/), talk back to it.
  if (window.location && window.location.protocol.indexOf("http") === 0 && window.location.hostname) {
    defaultHost = window.location.hostname;
    if (window.location.port) defaultPort = window.location.port;
  }
} catch {}
$("host").value = store.load("novex.host", defaultHost);
$("port").value = store.load("novex.port", defaultPort);
$("token").value = store.load("novex.token", "");

function log(...args) {
  const line = args.map((a) => typeof a === "string" ? a : JSON.stringify(a)).join(" ");
  $("log").textContent += line + "\n";
  $("log").scrollTop = $("log").scrollHeight;
}

function base() { return `http://${$("host").value}:${$("port").value}`; }
function auth() { return { "Authorization": "Bearer " + $("token").value }; }

async function api(method, path, body) {
  const res = await fetch(base() + path, {
    method,
    headers: Object.assign({ "Content-Type": "application/json" }, auth()),
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch {}
  if (!res.ok) {
    const msg = (json && json.error && `${json.error.code}: ${json.error.message}`) || `HTTP ${res.status}`;
    throw new Error(msg);
  }
  return json;
}

function bytesToBase64(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}

// Minimal ESC/POS test receipt (built in the browser, sent raw).
function testReceiptBytes() {
  const enc = new TextEncoder();
  const parts = [];
  const push = (...b) => { for (const x of b) parts.push(x); };
  push(0x1b, 0x40);                       // init
  push(0x1b, 0x61, 0x01);                 // center
  push(...enc.encode("NOVEX TEST\n"));
  push(0x1b, 0x61, 0x00);                 // left
  push(...enc.encode("--------------------------------\n"));
  push(...enc.encode("Item 1 .................. 2.50\n"));
  push(...enc.encode("Item 2 .................. 3.00\n"));
  push(0x1b, 0x45, 0x01);                 // bold on
  push(...enc.encode("TOTAL ................... 5.50\n"));
  push(0x1b, 0x45, 0x00);                 // bold off
  push(...enc.encode(new Date().toLocaleString() + "\n"));
  push(0x0a, 0x0a, 0x0a);
  push(0x1d, 0x56, 0x00);                 // cut
  return new Uint8Array(parts);
}

function parseHex(s) {
  const clean = s.trim().split(/[\s,]+/).filter(Boolean);
  const out = [];
  for (const tok of clean) {
    if (!/^[0-9a-fA-F]{2}$/.test(tok)) throw new Error(`bad hex byte: ${tok}`);
    out.push(parseInt(tok, 16));
  }
  return new Uint8Array(out);
}

let printers = [];
let ws = null;

async function connect() {
  store.save("novex.host", $("host").value);
  store.save("novex.port", $("port").value);
  store.save("novex.token", $("token").value);
  const healthRes = await fetch(base() + "/health");
  if (!healthRes.ok) throw new Error("agent not reachable at " + base());
  const info = await api("GET", "/api/v1/info");
  $("agentState").textContent = "Connected";
  $("agentDot").className = "dot ok";
  $("agentMeta").textContent = `v${info.version} · ${info.platform}/${info.arch} · USB: ${info.usbSupported ? "yes" : "no"}`;
  log("connected:", info);
  await refresh();
}

async function refresh() {
  const scan = $("scan").checked;
  const res = await api("GET", "/api/v1/printers" + (scan ? "?scan=true" : ""));
  printers = res.printers || [];
  log(`printers (${printers.length}):`, printers.map((p) => p.id));
  const box = $("printers");
  box.innerHTML = "";
  const sel = $("hexPrinter");
  sel.innerHTML = "";
  if (!printers.length) { box.innerHTML = "<p class='sub'>No printers found.</p>"; return; }
  for (const p of printers) {
    const div = document.createElement("div");
    div.className = "printer";
    const sub = p.type === "network"
      ? `Network · ${p.address}:${p.port}`
      : `USB · VID ${p.vendorId || "?"} PID ${p.productId || "?"}${p.serial ? " · " + p.serial : ""}`;
    div.innerHTML = `<div class="name"></div><div class="meta"></div>
      <div class="row"><button data-act="test">Test Print</button>
      <button data-act="status">Status</button>
      <button data-act="connect">Connect</button>
      <button data-act="disconnect">Disconnect</button></div>
      <div class="meta" data-role="out"></div>`;
    div.querySelector(".name").textContent = `${p.name} (${p.status})`;
    div.querySelector(".meta").textContent = `${p.id} — ${sub}`;
    const out = div.querySelector("[data-role=out]");
    div.querySelector('[data-act=test]').onclick = async () => {
      try {
        await api("POST", `/api/v1/printers/${encodeURIComponent(p.id)}/print`, { data: bytesToBase64(testReceiptBytes()) });
        out.textContent = "Test print sent ✓";
        log("print ok:", p.id);
      } catch (e) { out.textContent = String(e); log("print failed:", p.id, String(e)); }
    };
    div.querySelector('[data-act=status]').onclick = async () => {
      try { out.textContent = JSON.stringify(await api("GET", `/api/v1/printers/${encodeURIComponent(p.id)}/status`)); }
      catch (e) { out.textContent = String(e); }
    };
    div.querySelector('[data-act=connect]').onclick = async () => {
      try { await api("POST", `/api/v1/printers/${encodeURIComponent(p.id)}/connect`, {}); out.textContent = "Connected ✓"; }
      catch (e) { out.textContent = String(e); }
    };
    div.querySelector('[data-act=disconnect]').onclick = async () => {
      try { await api("POST", `/api/v1/printers/${encodeURIComponent(p.id)}/disconnect`, {}); out.textContent = "Disconnected ✓"; }
      catch (e) { out.textContent = String(e); }
    };
    box.appendChild(div);
    const opt = document.createElement("option");
    opt.value = p.id; opt.textContent = `${p.name} (${p.id})`;
    sel.appendChild(opt);
  }
}

function toggleWs() {
  if (ws) { ws.close(); return; }
  const url = `ws://${$("host").value}:${$("port").value}/ws?token=${encodeURIComponent($("token").value)}`;
  ws = new WebSocket(url);
  ws.onopen = () => { $("btnWs").textContent = "Subscribe: on"; log("ws: connected"); };
  ws.onmessage = (m) => log("ws:", m.data);
  ws.onclose = () => { ws = null; $("btnWs").textContent = "Subscribe: off"; log("ws: closed"); };
  ws.onerror = () => log("ws: error");
}

$("btnConnect").onclick = () => connect().catch((e) => {
  $("agentState").textContent = "Error";
  $("agentDot").className = "dot err";
  log("connect failed:", String(e));
});
$("btnRefresh").onclick = () => refresh().catch((e) => log("refresh failed:", String(e)));
$("btnWs").onclick = toggleWs;
$("btnHex").onclick = async () => {
  try {
    const id = $("hexPrinter").value;
    if (!id) throw new Error("no printer selected");
    const bytes = parseHex($("hex").value);
    await api("POST", `/api/v1/printers/${encodeURIComponent(id)}/print`, { data: bytesToBase64(bytes) });
    log("hex print ok:", id, bytes.length + " bytes");
  } catch (e) { log("hex print failed:", String(e)); }
};
$("btnRegister").onclick = async () => {
  try {
    const res = await api("POST", "/api/v1/printers", {
      name: $("regName").value, address: $("regAddr").value, port: parseInt($("regPort").value, 10),
    });
    log("registered:", res.printerId);
    await refresh();
  } catch (e) { log("register failed:", String(e)); }
};
</script>
</body>
</html>
