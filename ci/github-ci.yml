name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  go-test:
    name: go-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -v ./...

  go-build:
    name: go-build (${{ matrix.goos }}-${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/menuvex/novex-printer-agent/internal/platform.Version=ci" \
            -o "novex-printer-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            ./cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: novex-printer-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: novex-printer-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  sdk:
    name: sdk (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: install
        working-directory: sdk/typescript
        run: npm install --no-audit --no-fund
      - name: test (tsc build + node --test)
        working-directory: sdk/typescript
        run: npm test
